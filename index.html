<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG favicon: a sage-green leaf matching the site's palette.
         SVG favicons stay crisp at all sizes and are supported by all
         modern browsers. The .ico fallback line is omitted since we
         don't have one and legacy-IE support isn't needed. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content tells the browser to resize
         the layout viewport when the keyboard opens instead of scrolling.
         Without it, iOS scrolls position:fixed elements off-screen when
         an input is focused (pushes the header and nav off the top). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Judith's Archive</title>
    <meta name="description" content="Explore the life's work of Judith Orloff, Ed.D. through 85+ digitized documents on personal transformation, leadership, and experiential learning, with AI-powered search." />
    <!-- Open Graph: generates a rich preview card when the link is shared
         on social media, messaging apps, and link aggregators. -->
    <meta property="og:title" content="Judith's Archive" />
    <meta property="og:description" content="Explore the life's work of Judith Orloff, Ed.D. through 85+ digitized documents on personal transformation, leadership, and experiential learning." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://judithorloff.org" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Judith's Archive" />
    <meta name="twitter:description" content="Explore the life's work of Judith Orloff, Ed.D. through 85+ digitized documents on personal transformation, leadership, and experiential learning." />
    <!-- Preload the primary font weight so the browser starts fetching it
         before it discovers the @font-face rule in the CSS. Reduces FOUT. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/newsreader_normal_400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/newsreader_normal_700.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
